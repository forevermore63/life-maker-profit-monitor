<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Sausage Therapy Bookings</title><link rel="stylesheet" href="../styles.css"/></head><body><header><a class="brand" href="../index.html">&larr; LIFE MAKER</a><span class="pill">APP 1/10</span></header><div class="wrap hero"><div class="card"><div class="k">Passive engine</div><h1 class="h">Sausage Therapy Bookings</h1><p class="p">Take a deposit on a dachshund-assisted session. Waitlist fills the week.</p><label>Price / fee<input id="price" type="number" value="60"/></label><label>Units this month<input id="units" type="number" value="12"/></label><button class="btn" id="save">Lock this month into the pool</button><p class="p" id="sum"></p></div><div class="card"><div class="k">Checkout feel</div><h2 class="h">Human, not hustle</h2><p class="p">Copy stays kind. No fake urgency.</p><a class="btn ghost" href="../campaigns.html">Push paid traffic to this offer</a></div></div><script>const key="lm_app_booking";const saved=JSON.parse(localStorage.getItem(key)||"null");if(saved){document.getElementById("price").value=saved.price;document.getElementById("units").value=saved.units;}function paint(){const p=+document.getElementById("price").value,u=+document.getElementById("units").value;document.getElementById("sum").textContent="This engine: $"+(p*u).toLocaleString()+" this month.";}document.getElementById("save").onclick=()=>{localStorage.setItem(key,JSON.stringify({price:+document.getElementById("price").value,units:+document.getElementById("units").value}));paint();};paint();</script></body></html>
