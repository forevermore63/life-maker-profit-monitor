oas-1,0));localStorage.setItem('lm_campaign_boost',String(monthly));const log=JSON.parse(localStorage.getItem('lm_campaigns')||'[]');log.unshift({ch,offer:off,spend,roas,at:new Date().toISOString()});localStorage.setItem('lm_campaigns',JSON.stringify(log.slice(0,8)));show();};document.getElementById('stop').onclick=()=>{localStorage.removeItem('lm_campaign_boost');localStorage.removeItem('lm_campaigns');show();};show();</script></body></html>
