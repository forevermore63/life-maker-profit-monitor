<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Human Feel Studio</title><link rel="stylesheet" href="styles.css"/></head><body><header><a class="brand" href="index.html">&larr; LIFE MAKER</a><span class="pill">HUMAN FEEL</span></header><div class="wrap hero"><div class="card"><div class="k">Optimise the human feel</div><h1 class="h">Make the empire feel like home</h1><p class="p">Sliders change warmth and kind language so the money machine never feels like a casino.</p><label>Warmth<input id="w" type="range" min="0" max="100"></label><label>Stillness<input id="s" type="range" min="0" max="100"></label><label>Kind language<input id="k" type="range" min="0" max="100"></label><p class="p" id="preview"></p><button class="btn" id="save">Save feel profile</button></div><div class="card"><div class="k">Preview voice</div><h2 class="h" id="voiceTitle">Soft command</h2><p class="p" id="voice">The pool is filling. The dogs are sleeping. You can rest.</p></div></div><script>const ids=['w','s','k'];ids.forEach(id=>{const v=localStorage.getItem('lm_feel_'+id);document.getElementById(id).value=v??70;});const w_=document.getElementById('w'),s_=document.getElementById('s'),k_=document.getElementById('k');function paint(){const k=+k_.value;document.getElementById('voiceTitle').textContent=k>60?'Soft command':'Sharp command';document.getElementById('voice').textContent=k>60?'The pool is filling. The dogs are sleeping. You can rest.':'Revenue engines online. Campaign lever armed.';document.getElementById('preview').textContent=`Warmth ${w_.value} · Stillness ${s_.value} · Kindness ${k}`;}[w_,s_,k_].forEach(el=>el.oninput=paint);document.getElementById('save').onclick=()=>{ids.forEach(id=>localStorage.setItem('lm_feel_'+id,document.getElementById(id).value));document.getElementById('preview').textContent='Saved on this device.';};paint();</script></body></html>
